plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tikailo.myhtmlap'
    compileSdk 34

    defaultConfig {
        applicationId "com.tikailo.myhtmlap"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // игра — один файл, ресурсы не нужны
    buildFeatures {
        buildConfig false
    }
}
