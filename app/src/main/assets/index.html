<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b10" />
<meta name="color-scheme" content="dark" />
<title>Тикайло</title>
<style>
  :root{
    --bg:#0a0b10;
    --fg:#e9edf8;
    --muted:#8d9ab8;
    --size: clamp(110px, min(36vh, 54vw), 220px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    height:100vh;height:100dvh;max-height:100dvh;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  body::before{
    content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 50% 10%, rgba(88,120,255,.20), transparent 55%),
      radial-gradient(circle at 10% 90%, rgba(255,190,60,.10), transparent 50%),
      radial-gradient(circle at 90% 85%, rgba(0,220,200,.10), transparent 50%);
  }

  /* ---------- стекло ---------- */
  .glass{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px) saturate(1.6);
    -webkit-backdrop-filter:blur(14px) saturate(1.6);
    box-shadow:0 10px 30px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .ic{width:22px;height:22px;display:block;flex:0 0 auto;
    fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ic.sm{width:16px;height:16px;stroke-width:1.9}
  .ic.lg{width:26px;height:26px}

  /* ---------- шапка ---------- */
  header{
    position:relative;z-index:3;width:100%;max-width:620px;margin:0 auto;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 4px;
    text-align:center;min-width:0;
  }
  .topbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tb{
    display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    font-size:12px;color:var(--muted);white-space:nowrap;
  }
  .tb b{color:#e9edf8;font-weight:700;font-variant-numeric:tabular-nums}
  .tb.tk b{color:#ffcf6b}
  .tb .ic{width:15px;height:15px;opacity:.9}
  .tkTimer{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:0 16px 8px;max-width:588px;padding:9px 14px;border-radius:14px;
    font-size:12.5px;color:var(--muted);
  }
  .tkTimer b{color:#ffcf6b;font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
  .score{
    font-size:clamp(32px,8.5vw,50px);font-weight:800;line-height:1.05;
    letter-spacing:-1.5px;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#ffffff,#93a9ff 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stats{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:9px;min-width:0;max-width:100%}
  .chip{
    display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
    font-size:12px;color:var(--muted);white-space:nowrap;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  }
  .chip b{color:#c9d5f7;font-weight:600;font-variant-numeric:tabular-nums}
  .chip.gold b{color:#ffcf6b}
  .chip[hidden]{display:none}
  .tools{
    position:absolute;right:12px;top:calc(env(safe-area-inset-top, 0px) + 8px);
    display:flex;gap:6px;z-index:5;
  }
  .btn{
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);color:#8b98b8;padding:0;cursor:pointer;
    display:grid;place-items:center;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .btn:active{transform:scale(.92)}
  .btn.off{opacity:.45}

  /* ---------- сцена ---------- */
  main{
    flex:1;min-height:0;position:relative;z-index:2;
    display:flex;flex-direction:column;
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 92px);
  }
  .panel{display:none;flex:1;min-height:0;flex-direction:column}
  body[data-tab="tap"] #panelTap,
  body[data-tab="ach"] #panelAch,
  body[data-tab="shop"] #panelShop{display:flex}
  .scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

  #stage{
    flex:1 1 auto;min-height:calc(var(--size) + 12px);position:relative;width:100%;max-width:620px;margin:0 auto;
    display:grid;place-items:center;overflow:hidden;
  }
  .halo{
    position:absolute;width:calc(var(--size) * 1.7);height:calc(var(--size) * 1.7);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(109,139,255,.28), rgba(109,139,255,.06) 45%, transparent 70%);
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}

  .tik{
    position:relative;width:var(--size);height:var(--size);
    border-radius:50%;border:0;padding:0;cursor:pointer;
    background:radial-gradient(circle at 35% 28%, #5a6dff 0%, #232a55 55%, #0e1122 100%);
    box-shadow:0 0 0 1px rgba(140,165,255,.30), 0 24px 70px -14px rgba(80,110,255,.65),
               inset 0 0 46px rgba(130,165,255,.22);
    transition:transform .09s ease, filter .12s ease;overflow:hidden;
    display:grid;place-items:center;
  }
  .tik:active,.tik.hit{transform:scale(.92);filter:brightness(1.25)}
  .ring{
    position:absolute;inset:-14px;border-radius:50%;
    border:1px solid rgba(130,160,255,.35);animation:pulse 3s ease-out infinite;pointer-events:none;
  }
  .ring.r2{animation-delay:1.5s}
  @keyframes pulse{0%{transform:scale(.92);opacity:.7}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}
  .photo{
    position:relative;width:84%;aspect-ratio:1/1;border-radius:50%;
    overflow:hidden;pointer-events:none;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 32%, rgba(120,150,255,.30), rgba(10,13,26,.94) 72%), #090c18;
    box-shadow:inset 0 0 34px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.10), 0 0 26px rgba(109,139,255,.25);
  }
  .photo .face{
    width:94%;height:94%;object-fit:contain;object-position:center;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(1px)}50%{transform:translateY(-5px)}}

  .float{
    position:absolute;pointer-events:none;font-weight:800;font-size:21px;color:#fff;
    text-shadow:0 0 20px rgba(130,165,255,.95);animation:rise .85s ease-out forwards;
  }
  .float.crit{font-size:27px;color:#ffd76a;text-shadow:0 0 22px rgba(255,190,60,.95),0 0 44px rgba(255,120,0,.6)}
  .float.lucky{color:#7dffc4;text-shadow:0 0 22px rgba(60,255,170,.95),0 0 40px rgba(0,220,160,.5)}
  @keyframes rise{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}
    20%{transform:translate(-50%,-65%) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-190%) scale(1)}
  }
  .ripple{
    position:absolute;width:130px;height:130px;border-radius:50%;pointer-events:none;
    border:2px solid rgba(150,180,255,.75);transform:translate(-50%,-50%) scale(.15);
    animation:rip .55s ease-out forwards;
  }
  .ripple.crit{border-color:rgba(255,200,80,.9);width:190px;height:190px}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
  .spark{
    position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;
    background:#a8bcff;box-shadow:0 0 12px #6d8bff;animation:spark .62s ease-out forwards;
  }
  .spark.crit{background:#ffd76a;box-shadow:0 0 14px #ffb020}
  @keyframes spark{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}
  }
  #stage.shake{animation:shake .22s ease}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-1px)}
  }

  /* ---------- магазины ---------- */
  .list{
    display:grid;gap:8px;padding:8px 14px 14px;
    grid-template-columns:repeat(auto-fit, minmax(215px, 1fr));
    width:100%;max-width:620px;margin:0 auto;
  }
  #shop{
    flex:0 0 auto;max-height:min(38vh, 360px);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .up{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:10px 12px;border-radius:16px;font:inherit;color:inherit;cursor:pointer;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
    transition:transform .12s ease, background .2s, border-color .2s, opacity .2s;
  }
  .up:active{transform:scale(.985)}
  .up.can{background:linear-gradient(135deg, rgba(95,125,255,.22), rgba(95,125,255,.06));border-color:rgba(125,155,255,.45)}
  .up.poor{opacity:.55}
  .up.maxed{opacity:.75;border-color:rgba(75,227,164,.4)}
  .up .ico{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;
    display:grid;place-items:center;color:#a9b8da;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);
  }
  .up .txt{flex:1;min-width:0}
  .up .nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .up .lvl{font-size:10.5px;font-weight:600;color:#8fa4d8;background:rgba(255,255,255,.07);padding:1px 6px;border-radius:999px}
  .up .ds{font-size:11.5px;color:var(--muted);margin-top:2px}
  .up .cost{
    font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:#93aaff;
    white-space:nowrap;display:flex;align-items:center;gap:4px;
  }
  .up.poor .cost{color:#6a7699}
  .up.maxed .cost{color:#4be3a4;font-size:12px}
  .up.gold .ico{color:#ffcf6b;background:rgba(255,200,80,.10);border-color:rgba(255,200,80,.22)}
  .up.gold .cost{color:#ffcf6b}
  .up.gold.can{border-color:rgba(255,200,80,.45);background:linear-gradient(135deg, rgba(255,200,80,.20), rgba(255,200,80,.05))}

  /* ---------- шапки панелей ---------- */
  .phead{
    width:100%;max-width:620px;margin:0 auto;padding:10px 16px 6px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .phead .ttl{font-size:14px;color:#b9c6e6;display:flex;align-items:center;gap:7px}
  .phead .ttl b{color:#fff;font-variant-numeric:tabular-nums}
  .phead .gold{display:flex;align-items:center;gap:6px;font-size:13px;color:#ffcf6b;font-weight:700}
  .achBar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.06);margin:0 16px 4px;max-width:588px}
  .achBar i{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#6d8bff,#4be3a4);
    box-shadow:0 0 14px rgba(75,227,164,.5);
    transition:width .5s cubic-bezier(.3,1,.4,1);
  }

  /* ---------- достижения ---------- */
  .achCard{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:15px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
    opacity:.5;transition:opacity .4s ease, border-color .4s, background .4s;
  }
  .achCard.done{
    opacity:1;border-color:rgba(75,227,164,.32);
    background:linear-gradient(135deg, rgba(75,227,164,.13), rgba(75,227,164,.03));
  }
  .achCard .ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:grid;place-items:center;color:#7f8cae;background:rgba(255,255,255,.05)}
  .achCard.tk .ico{color:#ffcf6b;background:rgba(255,200,80,.10)}
  .achCard.tk{border-color:rgba(255,200,80,.22)}
  .achCard.done .ico{color:#4be3a4;background:rgba(75,227,164,.12)}
  .achCard .txt{flex:1;min-width:0}
  .achCard .nm{font-size:13px;font-weight:600;display:block}
  .achCard .ds{font-size:11px;color:var(--muted);display:block;margin-top:2px}
  .achCard .rw{font-size:11px;color:#ffcf6b;display:block;margin-top:3px}
  .achCard .tick{width:18px;height:18px;color:#6a7699}
  .achCard.done .tick{color:#4be3a4}
  @keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .achCard.done.pop{animation:pop .45s cubic-bezier(.34,1.5,.5,1)}

  /* ---------- док вкладок ---------- */
  .dock{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    display:inline-flex;gap:2px;padding:5px;border-radius:24px;z-index:40;
    background:rgba(16,20,34,.55);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(1.9);
    -webkit-backdrop-filter:blur(22px) saturate(1.9);
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);
    max-width:calc(100% - 24px);
  }
  .dock .ind{
    position:absolute;top:0;left:0;width:0;height:0;border-radius:20px;pointer-events:none;overflow:hidden;
    background:linear-gradient(150deg, rgba(255,255,255,.5), rgba(255,255,255,.12) 40%, rgba(120,150,255,.4) 72%, rgba(90,120,255,.24));
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 8px 22px rgba(70,100,255,.45), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 8px rgba(20,30,80,.35);
    transition:left .42s cubic-bezier(.34,1.42,.5,1), width .42s cubic-bezier(.34,1.42,.5,1),
               top .42s cubic-bezier(.34,1.42,.5,1), height .42s cubic-bezier(.34,1.42,.5,1);
  }
  .dock .ind::after{
    content:"";position:absolute;inset:1px;border-radius:20px;
    background:linear-gradient(120deg, rgba(255,255,255,.55), rgba(255,255,255,0) 45%);
  }
  .tab{
    position:relative;z-index:1;border:0;background:none;color:#98a6c6;
    font:inherit;font-size:12.5px;padding:9px 14px;border-radius:20px;cursor:pointer;
    display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .3s ease;
  }
  .tab.active{color:#fff}
  .badge{
    font-style:normal;font-size:11px;color:#d6e3ff;background:rgba(255,255,255,.14);
    padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;
  }
  .tab .ic{width:18px;height:18px}

  /* ---------- тосты ---------- */
  #toasts{
    position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 10px);transform:translateX(-50%);
    z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;
    width:max-content;max-width:92vw;pointer-events:none;
  }
  .toast{
    display:flex;align-items:center;gap:8px;
    padding:10px 16px;border-radius:999px;font-size:13px;text-align:center;
    background:rgba(18,22,38,.92);border:1px solid rgba(125,155,255,.38);
    box-shadow:0 12px 34px rgba(0,0,0,.6);
    animation:tin .3s ease, tout .35s ease 2.9s forwards;
  }
  .toast .ic{color:#ffcf6b}
  @keyframes tin{from{opacity:0;transform:translateY(-10px)}}
  @keyframes tout{to{opacity:0;transform:translateY(-10px)}}
</style>
</head>

        try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; }
      }
    };
  })();
  const scoreEl = $('score'), pcEl = $('perClick'), psEl = $('perSec'),
        critEl = $('critStat'), cpEl = $('critPower'), lkEl = $('luckyStat'),
        luckyChip = $('luckyChip'),
        coinStat = $('coinStat'), tkStat = $('tkStat'), tkTimer = $('tkTimer'),
        cpsEl = $('cpsStat'),
        shopEl = $('shop'), goldListEl = $('goldList'),
        stage = $('stage'), tik = $('tik'), toastsEl = $('toasts'),
        achList = $('achList'), achBadge = $('achBadge'), achCount = $('achCount'),
        achBar = $('achBar'), achGold = $('achGold'), shopGold = $('shopGold'), goldBadge = $('goldBadge');

  /* ================= числа ================= */
  const SUF = [['квдр',1e15],['трлн',1e12],['млрд',1e9],['млн',1e6],['тыс',1e3]];
  function fmt(n) {
    if (!isFinite(n)) return '∞';
    if (n < 0) n = 0;
    if (n < 1000) return n < 10 && n % 1 !== 0 ? n.toFixed(1) : String(Math.floor(n));
    for (let i = 0; i < SUF.length; i++) {
      const v = SUF[i][1];
      if (n >= v) {
        const x = n / v;
        return (x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : Math.floor(x)) + ' ' + SUF[i][0];
      }
    }
    return n.toExponential(1).replace('e+', 'e');
  }
  function fmtMult(n) {
    if (n < 10) return n % 1 === 0 ? String(n) : n.toFixed(1);
    return fmt(n);
  }
  function fmtTime(sec) {
    if (sec < 90) return Math.round(sec) + ' сек';
    if (sec < 5400) return Math.round(sec / 60) + ' мин';
    return (sec / 3600).toFixed(1) + ' ч';
  }
  function icon(id, cls) {
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#' + id + '"/></svg>';
  }

  /* ================= характеристики ================= */
  function stats() {
    const g = function (id) { return S.levels[id] || 0; };
    const gl = function (id) { return S.glevels[id] || 0; };
    let tapFlat = 0, psFlat = 0, critAdd = 0, cpowAdd = 0, multAdd = 0, luckyAdd = 0;
    let tapAdd = 0, psAdd = 0;
    let tapX = 1, psX = 1, megaX = 1, critX = 1, cpowX = 1;
    let totalLevels = 0, psLevels = 0, multLevels = 0, critLevels = 0, distinct = 0;
    let combo = 0, synergy = 0, greed = 0, hunter = 0;

    for (let i = 0; i < UPS.length; i++) {
      const u = UPS[i], lvl = g(u.id);
      if (!lvl) continue;
      totalLevels += lvl; distinct++;
      switch (u.kind) {
        case 'tap':    tapFlat += u.val * lvl; break;
        case 'ps':     psFlat  += u.val * lvl; psLevels += lvl; break;
        case 'crit':   critAdd += u.val * lvl; critLevels += lvl; break;
        case 'cpow':   cpowAdd += u.val * lvl; critLevels += lvl; break;
        case 'mult':   multAdd += u.val * lvl; multLevels += lvl; break;
        case 'lucky':  luckyAdd += u.val * lvl; break;
        case 'tapx':   tapX  *= Math.pow(u.val, lvl); multLevels += lvl; break;
        case 'psx':    psX   *= Math.pow(u.val, lvl); multLevels += lvl; break;
        case 'mega':   megaX *= Math.pow(u.val, lvl); multLevels += lvl; break;
        case 'critx':  critX *= Math.pow(u.val, lvl); critLevels += lvl; break;
        case 'cpowx':  cpowX *= Math.pow(u.val, lvl); critLevels += lvl; break;
        case 'tapadd': tapAdd += u.val * lvl; break;
        case 'psadd':  psAdd  += u.val * lvl; break;
        case 'comp1':  combo = lvl; break;
        case 'comp2':  synergy = lvl; break;
        case 'comp3':  greed = lvl; break;
        case 'comp4':  hunter = lvl; break;
      }
    }

    // лавка тикоинов
    let gTapPct = 0, gPsFlat = 0, gPsPct = 0, gCrit = 0, gCpow = 0, gGlob = 0, gLucky = 0;
    let gTapX = 1, gPsX = 1, gGlobX = 1;
    for (let i = 0; i < GSHOP.length; i++) {
      const u = GSHOP[i], lvl = gl(u.id);
      if (!lvl) continue;
      switch (u.kind) {
        case 'gtap':   gTapPct += u.val * lvl; break;
        case 'gps':    gPsFlat += u.val * lvl; break;
        case 'gpsp':   gPsPct += u.val * lvl; break;
        case 'gcrit':  gCrit += u.val * lvl; break;
        case 'gcpow':  gCpow += u.val * lvl; break;
        case 'gglob':  gGlob += u.val * lvl; break;
        case 'glucky': gLucky += u.val * lvl; break;
        case 'gtapx':  gTapX *= Math.pow(u.val, lvl); break;
        case 'gpsm':   gPsX *= Math.pow(u.val, lvl); break;
        case 'gglobx': gGlobX *= Math.pow(u.val, lvl); break;
      }
    }

    // бонусы за достижения
    const B = S.bonus || {};
    const bMult = 1 + (B.mult || 0), bTap = 1 + (B.tap || 0), bPs = 1 + (B.ps || 0);

    const mult = (1 + multAdd) * megaX * (1 + gGlob) * gGlobX * bMult;
    let tap = (1 + tapFlat) * mult * tapX * gTapX * (1 + tapAdd) * (1 + gTapPct) * bTap;
    let ps  = psFlat * mult * psX * gPsX * (1 + psAdd) * (1 + gPsPct) * bPs + gPsFlat * (1 + gPsPct) * bPs;
    if (combo)   tap *= (1 + 0.01 * combo * totalLevels);
    if (synergy) { const m = 1 + 0.02 * synergy * psLevels; tap *= m; ps *= m; }
    if (greed)   ps  *= (1 + 0.05 * greed * multLevels);

    return {
      tap: tap,
      ps: ps,
      mult: mult,
      critChance: Math.min(0.9, ((0.05 + critAdd) * critX * gGlobX + gCrit + (B.crit || 0))),
      critPower: ((5 + cpowAdd) * cpowX * megaX * gGlobX * (1 + gGlob)) + gCpow + (B.cpow || 0),
      lucky: Math.min(0.8, luckyAdd + gLucky + (B.lucky || 0)),
      totalLevels: totalLevels,
      distinct: distinct
    };
  }

  function cost(u) {
    return Math.ceil(u.base * Math.pow(u.growth, S.levels[u.id] || 0));
  }
  function goldCost(u) {
    const lvl = S.glevels[u.id] || 0;
    return u.gold + Math.floor(u.gold * 0.5 * lvl);
  }

  /* ================= звук ================= */
  const Sound = {
    ctx: null, on: true,
    init: function () {
      if (!this.ctx) {
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
      }
      if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    },
    noise: function () {
      const ctx = this.ctx;
      if (ctx._nb) return ctx._nb;
      const len = Math.floor(ctx.sampleRate * 0.25);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      ctx._nb = buf;
      return buf;
    },
    tone: function (freq, dur, type, vol, slideTo) {
      const ctx = this.ctx;
      if (!ctx) return;
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const o = ctx.createOscillator();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    },
    click: function (power) {
      if (!this.on || !this.ctx) return;
      const ctx = this.ctx, t = ctx.currentTime;
      const f = 170 + Math.min(640, Math.pow(power, 0.32) * 14);
      this.tone(f, 0.09, 'triangle', 0.20, f * 0.62);
      const n = ctx.createBufferSource(); n.buffer = this.noise();
      const nf = ctx.createBiquadFilter();
      nf.type = 'bandpass'; nf.frequency.value = 1800; nf.Q.value = 0.7;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.09, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      n.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
      n.start(t); n.stop(t + 0.06);
    },
    crit: function () {
      if (!this.on || !this.ctx) return;
      const ctx = this.ctx, t = ctx.currentTime;
      this.tone(520, 0.30, 'sawtooth', 0.10, 1250);
      this.tone(790, 0.34, 'sine', 0.14, 1900);
      this.tone(1560, 0.22, 'triangle', 0.07, 2350);
      const n = ctx.createBufferSource(); n.buffer = this.noise();
      const nf = ctx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 2400;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.10, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      n.connect(nf); nf.connect(ng); ng.connect(ctx.destination);
      n.start(t); n.stop(t + 0.2);
    },
    buy: function () {
      if (!this.on || !this.ctx) return;
      this.tone(660, 0.12, 'sine', 0.16);
      const self = this;
      setTimeout(function () { self.tone(990, 0.20, 'sine', 0.14); }, 90);
    },
    deny: function () {
      if (!this.on || !this.ctx) return;
      this.tone(160, 0.15, 'square', 0.07, 90);
    },
    tick: function () {
      if (!this.on || !this.ctx) return;
      this.tone(1450, 0.05, 'sine', 0.030);
    },
    lucky: function () {
      if (!this.on || !this.ctx) return;
      this.tone(700, 0.10, 'triangle', 0.13, 1400);
    },
    ach: function () {
      if (!this.on || !this.ctx) return;
      const self = this;
      this.tone(880, 0.13, 'sine', 0.13);
      setTimeout(function () { self.tone(1320, 0.24, 'sine', 0.11); }, 100);
    }
  };

  /* ================= магазин (обычный) ================= */

  function buy(id) {
    const u = UPS.filter(function (x) { return x.id === id; })[0];
    if (!u) return;
    const lvl = S.levels[id] || 0;
    if (u.max && lvl >= u.max) return;
    const c = cost(u);
    if (S.score < c) {
      Sound.init(); Sound.deny();

    S.score -= c;
    S.levels[id] = lvl + 1;
    S.purchases++;

  /* ================= отрисовка ================= */
  let cache = { s:'', pc:'', ps:'', cr:'', cp:'', lk:'', gd:'', cs:'', cpc:'' };
  function paint(st, forceShop) {
    const s = fmt(S.score);
    if (s !== cache.s) { scoreEl.textContent = s; cache.s = s; }

    const pc = fmt(st.tap);
    if (pc !== cache.pc) { pcEl.textContent = pc; cache.pc = pc; }

    const ps = fmt(st.ps);
    if (ps !== cache.ps) { psEl.textContent = ps; cache.ps = ps; }

    const cr = Math.round(st.critChance * 100) + '%';
    if (cr !== cache.cr) { critEl.textContent = cr; cache.cr = cr; }

    const cp = '×' + fmtMult(st.critPower);
    if (cp !== cache.cp) { cpEl.textContent = cp; cache.cp = cp; }

    const lk = Math.round(st.lucky * 100) + '%';
    if (lk !== cache.lk) {
      lkEl.textContent = lk; cache.lk = lk;
      luckyChip.hidden = st.lucky <= 0;
    }

    const gd = String(Math.floor(S.gold));
    if (gd !== cache.gd) {
      cache.gd = gd;
      achGold.textContent = gd;
      shopGold.textContent = gd;
      goldBadge.textContent = gd;
      if (tkStat) tkStat.textContent = gd;
    }
    const cs = fmt(S.score);
    if (cs !== cache.cs) { if (coinStat) coinStat.textContent = cs; cache.cs = cs; }

    const cpc = String(cpsNow);
    if (cpc !== cache.cpc) { if (cpsEl) cpsEl.textContent = cpc; cache.cpc = cpc; }

    for (let i = 0; i < UPS.length; i++) {
      const u = UPS[i], e = els[u.id];
      if (!e) continue;
      const lvl = S.levels[u.id] || 0;
      const c = cost(u);
      const maxed = u.max && lvl >= u.max;
      const visible = maxed || lvl > 0 || S.total >= u.base * 0.5 || i < 3;
      const disp = visible ? '' : 'none';
      if (e.btn.style.display !== disp) e.btn.style.display = disp;
      if (!visible) continue;

      const label = maxed ? 'МАКС' : fmt(c);
      if (e.cost.textContent !== label) e.cost.textContent = label;

      const lv = lvl > 0 ? 'ур. ' + lvl : '';
      if (e.lvl.textContent !== lv) e.lvl.textContent = lv;

      const cls = maxed ? 'up maxed' : (S.score >= c ? 'up can' : 'up poor');
      if (e.btn.className !== cls) e.btn.className = cls;
    }

    for (let i = 0; i < GSHOP.length; i++) {
      const u = GSHOP[i], e = gels[u.id];
      if (!e) continue;
      const lvl = S.glevels[u.id] || 0;
      const c = goldCost(u);
      const label = fmt(c);
      if (e.cost.textContent !== label) e.cost.textContent = label;
      const lv = lvl > 0 ? 'ур. ' + lvl : '';
      if (e.lvl.textContent !== lv) e.lvl.textContent = lv;
      const cls = S.gold >= c ? 'up gold can' : 'up gold poor';
      if (e.btn.className !== cls) e.btn.className = cls;
    }
  }

  /* ================= эффекты ================= */
  function addFx(node) {
    if (stage.childElementCount > 70) return;

    node.addEventListener('animationend', function () { node.remove(); });
  }
  function floatText(x, y, text, crit, lucky) {
    const el = document.createElement('div');
    el.className = 'float' + (crit ? ' crit' : '') + (lucky && !crit ? ' lucky' : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    addFx(el);
  }
  function ripple(x, y, crit) {
    const el = document.createElement('div');

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    addFx(el);
  }
  function sparks(x, y, n, crit) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 70;
      const el = document.createElement('div');
      el.className = 'spark' + (crit ? ' crit' : '');
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
      el.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
      addFx(el);
    }
  }

  /* ================= тык ================= */
  function doTap(clientX, clientY, viaKey) {
    const st = stats();
    const crit = Math.random() < st.critChance;
    const lucky = Math.random() < st.lucky;
    let gain = st.tap;
    if (crit) gain *= st.critPower;
    if (lucky) gain *= 2;

    S.score += gain;
    S.total += gain;
    S.clicks++;
    tapsInSec++;
    if (crit) S.crits++;
    if (lucky) S.luckyHits++;

    const r = stage.getBoundingClientRect();
    const x = viaKey ? r.width / 2 : clientX - r.left;
    const y = viaKey ? r.height / 2 : clientY - r.top;

    floatText(x, y, '+' + fmt(gain) + (lucky ? ' ×2' : ''), crit, lucky);
    ripple(x, y, crit);
    sparks(x, y, crit ? 11 : lucky ? 9 : 5, crit);

    Sound.init();
    if (crit) Sound.crit();
    else if (lucky) Sound.lucky();
    else Sound.click(st.tap);

    if (crit) {
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) {} }
    } else if (navigator.vibrate) {
      try { navigator.vibrate(4); } catch (e) {}
    }

    scoreEl.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.07)' }, { transform: 'scale(1)' }],
      { duration: 180, easing: 'ease-out' }
    );

    paint(stats());
  }

    [10, 100, 1000, 10000, 1e6, 1e9].forEach(function (n) {
      add('i-factory', 'Пассив: ' + N(n) + '/сек', 'Пассивный доход ' + N(n) + ' в секунду', n >= 1e9 ? 20 : 0, { ps: 0.05 },
        function (s, st) { return st.ps >= n; });
    });
    [0.1, 0.25, 0.5, 0.75].forEach(function (n) {
      add('i-target', 'Крит ' + Math.round(n * 100) + '%', 'Шанс крита ' + Math.round(n * 100) + '%', n >= 0.75 ? 12 : 0, { crit: 0.01 },
        function (s, st) { return st.critChance >= n; });
    });
    [10, 25, 50, 100, 1000].forEach(function (n) {
      add('i-fire', 'Сила крита ×' + N(n), 'Крит должен бить в ' + N(n) + ' раз сильнее', n >= 1000 ? 15 : 0, { cpow: 2 },
        function (s, st) { return st.critPower >= n; });
    });
    [0.1, 0.25, 0.5].forEach(function (n) {
      add('i-dice', 'Двойной тык ' + Math.round(n * 100) + '%', 'Шанс двойного тыка ' + Math.round(n * 100) + '%', n >= 0.5 ? 10 : 0, { lucky: 0.02 },
        function (s, st) { return st.lucky >= n; });
    });
    [1, 5, 10, 25, 50, 100, 200, 300, 400].forEach(function (n) {
      add('i-chartup', 'Уровней: ' + N(n), 'Купи суммарно ' + N(n) + ' уровней улучшений', n >= 400 ? 25 : 0, { mult: 0.01 },
        function (s, st) { return st.totalLevels >= n; });
    });
    [1, 5, 10, 25, 50].forEach(function (n) {
      add('i-box', 'Улучшений: ' + N(n), 'Купи ' + N(n) + ' разных улучшений', n >= 50 ? 25 : 0, { tap: 0.02 },
        function (s, st) { return st.distinct >= n; });
    });
    [['finger', 20, 0], ['catgod', 1, 30], ['turbo', 10, 0], ['quantum', 1, 0], ['auto', 15, 0],
     ['robot', 8, 0], ['factory', 8, 0], ['crit', 5, 0], ['luck', 10, 0], ['mult', 8, 0],
     ['mega', 3, 20], ['tapx2', 3, 0], ['secx2', 3, 0], ['critpow', 12, 0], ['tapx20', 1, 12],
     ['overflow', 1, 15], ['galaxy', 3, 0], ['crown', 5, 0], ['boost', 1, 0], ['boost2', 1, 0]].forEach(function (p) {
      const u = UPS.filter(function (x) { return x.id === p[0]; })[0];
      add('i-star', u.name + ' ур. ' + p[1], 'Купи «' + u.name + '» ' + p[1] + ' ур.', p[2], { mult: 0.003 },
        function (s) { return (s.levels[u.id] || 0) >= p[1]; });
    });
    [1, 10, 50, 100, 250].forEach(function (n) {
      add('i-coin', 'Покупок: ' + N(n), 'Соверши ' + N(n) + ' покупок улучшений', n >= 250 ? 10 : 0, { mult: 0.003 },
        function (s) { return s.purchases >= n; });
    });
    [1, 10, 100, 1000].forEach(function (n) {
      add('i-clover', 'Двойных тыков: ' + N(n), 'Поймай ' + N(n) + ' двойных тыков', 0, { ps: 0.02 },
        function (s) { return s.luckyHits >= n; });
    });

    return A;
  }

  const ACH = buildAchievements();
  const achEls = [];

  function rewardText(a) {
    let t = a.tk ? '+' + a.tk + ' тикоинов' : '';
    const b = a.bonus;
    if (b) {
      if (b.mult) t += ', +' + Math.round(b.mult * 100) + '% ко всему';
      if (b.tap)  t += ', +' + Math.round(b.tap * 100) + '% к тыку';
      if (b.ps)   t += ', +' + Math.round(b.ps * 100) + '% к пассиву';
      if (b.crit) t += ', +' + Math.round(b.crit * 100) + '% к криту';
      if (b.cpow) t += ', +' + b.cpow + ' к силе крита';
      if (b.lucky) t += ', +' + Math.round(b.lucky * 100) + '% к двойному тыку';
    }
    if (!t) t = 'бонус к характеристикам';
    return t;
  }

  function buildAchUI() {
    achList.innerHTML = '';
    ACH.forEach(function (a, i) {
      const d = document.createElement('div');
      d.className = 'achCard';
      d.innerHTML =
        '<span class="ico">' + icon(a.ico) + '</span>' +
        '<span class="txt"><span class="nm">' + a.name + '</span>' +
        '<span class="ds">' + a.desc + '</span>' +
        '<span class="rw">Награда: ' + rewardText(a) + '</span></span>' +
        '<span class="tick">' + icon('i-lock', 'sm') + '</span>';
      achList.appendChild(d);
      achEls[i] = { el: d, tick: d.querySelector('.tick') };
    });
  }

  function recalcBonus() {
    const B = { mult: 0, tap: 0, ps: 0, crit: 0, cpow: 0, lucky: 0 };
    for (let i = 0; i < ACH.length; i++) {
      const a = ACH[i];
      if (!S.ach[a.name] || !a.bonus) continue;
      for (const k in a.bonus) B[k] = (B[k] || 0) + a.bonus[k];
    }
    S.bonus = B;
  }

  function checkAch(st) {
    let unlocked = 0;
    const fresh = [];
    for (let i = 0; i < ACH.length; i++) {
      const a = ACH[i];
      let done = !!S.ach[a.name];
      if (!done) {
        try { done = !!a.test(S, st); } catch (e) { done = false; }
      }
      const e = achEls[i];
      if (e) {
        const cls = 'achCard' + (a.tk ? ' tk' : '') + (done ? ' done' : '');
        if (e.el.className !== cls) e.el.className = cls;
        const tk = done ? icon('i-check', 'sm') : icon('i-lock', 'sm');
        if (e.tick.innerHTML !== tk) e.tick.innerHTML = tk;
      }
      if (!done) continue;
      unlocked++;
      if (!S.ach[a.name]) {
        S.ach[a.name] = 1;
        if (a.tk) S.gold += a.tk;
        fresh.push(a);
        if (e) {
          e.el.classList.add('pop');
          setTimeout(function () { e.el.classList.remove('pop'); }, 500);
        }
      }
    }
    if (fresh.length) {
      Sound.ach();
      recalcBonus();
      save();
      toast('Достижение: ' + fresh[0].name + (fresh.length > 1 ? ' и ещё ' + (fresh.length - 1) : ''), 'i-trophy');
    }
    const label = unlocked + '/' + ACH.length;
    if (achBadge.textContent !== label) achBadge.textContent = label;
    const label2 = unlocked + ' / ' + ACH.length;
    if (achCount.textContent !== label2) achCount.textContent = label2;
    achBar.style.width = (ACH.length ? unlocked / ACH.length * 100 : 0) + '%';
  }

  /* ================= вкладки (док) ================= */
  const dockEl = $('dock'), dockInd = $('dockInd');
  const tabBtns = Array.prototype.slice.call(dockEl.querySelectorAll('.tab'));
  function moveInd() {
    const act = dockEl.querySelector('.tab.active');
    if (!act) return;
    const pr = dockEl.getBoundingClientRect();
    const br = act.getBoundingClientRect();
    dockInd.style.left = (br.left - pr.left - dockEl.clientLeft) + 'px';
    dockInd.style.top = (br.top - pr.top - dockEl.clientTop) + 'px';
    dockInd.style.width = br.width + 'px';
    dockInd.style.height = br.height + 'px';
  }
  function setTab(name) {
    document.body.setAttribute('data-tab', name);
    tabBtns.forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
    moveInd();
    if (name === 'ach') checkAch(stats());
    if (name === 'shop') paint(stats(), true);
  }
  tabBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      Sound.init(); Sound.tick();
      setTab(b.dataset.tab);
    });
  });
  window.addEventListener('resize', moveInd);
  window.addEventListener('load', moveInd);
  setTimeout(moveInd, 80);

  /* ================= сохранение ================= */
  function save() {
    S.last = Date.now();
    try { LS.set(KEY, JSON.stringify(S)); } catch (e) {}
  }
  function load() {
    let raw = null;
    try { raw = LS.get(KEY); } catch (e) {}
    if (raw) {
      try {
        const d = JSON.parse(raw);
        if (d && typeof d === 'object') {
          S.score = +d.score || 0;
          S.total = +d.total || 0;
          S.clicks = +d.clicks || 0;
          S.crits = +d.crits || 0;
          S.purchases = +d.purchases || 0;
          S.luckyHits = +d.luckyHits || 0;
          S.gold = +d.gold || 0;
          S.goldAcc = +d.goldAcc || 0;
          S.last = +d.last || 0;
          S.levels = {}; S.glevels = {}; S.ach = {};
          if (d.levels && typeof d.levels === 'object') {
            for (const k in d.levels) S.levels[k] = Math.max(0, Math.floor(+d.levels[k] || 0));
          }
          if (d.glevels && typeof d.glevels === 'object') {
            for (const k in d.glevels) S.glevels[k] = Math.max(0, Math.floor(+d.glevels[k] || 0));
          }
          if (d.ach && typeof d.ach === 'object') {
            for (const k in d.ach) S.ach[k] = 1;
          }
        }
      } catch (e) {}
    }
    recalcBonus();

    const st = stats();
    const elapsed = S.last ? (Date.now() - S.last) / 1000 : 0;
    if (st.ps > 0 && elapsed > 60) {
      const secs = Math.min(elapsed, 6 * 3600);
      const gain = st.ps * secs * 0.6;
      S.score += gain; S.total += gain;
      setTimeout(function () { toast('Пока тебя не было: +' + fmt(gain) + ' за ' + fmtTime(secs), 'i-gear'); }, 700);
    }
  }

  /* ================= цикл ================= */
  let prev = performance.now();
  let paintAcc = 0, tickAcc = 0, achAcc = 0, tkAcc = 0;
  let tapsInSec = 0, cpsNow = 0, cpsAcc = 0;

  function loop(t) {
    try { step(t); } catch (e) { if (window.console) console.error('tick', e); }
    requestAnimationFrame(loop);
  }

  function step(t) {
    let dt = (t - prev) / 1000;
    prev = t;
    if (dt > 0.5) dt = 0.5;

    const st = stats();
    if (st.ps > 0) {
      const add = st.ps * dt;
      S.score += add; S.total += add;
      tickAcc += dt;
      if (tickAcc >= 1) { tickAcc = 0; Sound.tick(); }
    } else { tickAcc = 0; }

    paintAcc += dt;
    if (paintAcc > 0.06) { paintAcc = 0; paint(st); }

    achAcc += dt;
    if (achAcc > 0.4) { achAcc = 0; checkAch(st); }

    S.goldAcc += dt;
    if (S.goldAcc >= TK_SEC) {
      S.goldAcc -= TK_SEC;
      S.gold++;
      Sound.ach();
      toast('+1 тикоин', 'i-gem');
      save();
    }
    cpsAcc += dt;
    if (cpsAcc >= 1) { cpsAcc = 0; cpsNow = tapsInSec; tapsInSec = 0; }

    tkAcc += dt;
    if (tkAcc > 0.2) {
      tkAcc = 0;
      const left = Math.max(0, Math.ceil(TK_SEC - S.goldAcc));
      const mm = Math.floor(left / 60), ss = left % 60;
      const txt = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      if (tkTimer && tkTimer.textContent !== txt) tkTimer.textContent = txt;
    }
  }

  /* ================= сброс ================= */
  $('reset').addEventListener('click', function () {
    if (!confirm('Сбросить весь прогресс, тикоинов и достижения?')) return;
    S.score = 0; S.total = 0; S.clicks = 0; S.crits = 0;
    S.purchases = 0; S.luckyHits = 0; S.gold = 0;
    S.levels = {}; S.glevels = {}; S.ach = {}; S.bonus = {}; S.last = 0;
    cache = { s:'', pc:'', ps:'', cr:'', cp:'', lk:'', gd:'' };
    try { LS.remove(KEY); } catch (e) {}
    recalcBonus();
    paint(stats(), true);
    checkAch(stats());
    toast('Прогресс сброшен', 'i-reset');
  });

      let dup = false;
      for (let j = 0; j < bgs.length; j++) {
        const dr = cands[i][0] - bgs[j][0], dg = cands[i][1] - bgs[j][1], db = cands[i][2] - bgs[j][2];
        if (dr * dr + dg * dg + db * db < 45 * 45) { dup = true; break; }
      }
      if (!dup) bgs.push(cands[i]);
    }
    if (!bgs.length) return;

    const TOL = 30 * 30;
    function near(i) {
      for (let k = 0; k < bgs.length; k++) {
        const dr = p[i] - bgs[k][0], dg = p[i + 1] - bgs[k][1], db = p[i + 2] - bgs[k][2];
        if (dr * dr + dg * dg + db * db < TOL) return true;
      }
      return false;
    }
    const mark = new Uint8Array(w * h);
    const stack = [];
    function tryPush(x, y) {
      const f = y * w + x;
      if (!mark[f] && near(idx(x, y))) { mark[f] = 1; stack.push(f); }
    }
    for (let x = 0; x < w; x++) { tryPush(x, 0); tryPush(x, h - 1); }
    for (let y = 0; y < h; y++) { tryPush(0, y); tryPush(w - 1, y); }
    while (stack.length) {
      const f = stack.pop();
      const x = f % w, y = (f / w) | 0;
      if (x > 0) tryPush(x - 1, y);
      if (x < w - 1) tryPush(x + 1, y);
      if (y > 0) tryPush(x, y - 1);
      if (y < h - 1) tryPush(x, y + 1);
    }
    let removed = 0, minX = w, minY = h, maxX = 0, maxY = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const f = y * w + x;
        if (mark[f]) { p[f * 4 + 3] = 0; removed++; }
        else {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (removed < w * h * 0.08 || removed > w * h * 0.75) return;
    cx.putImageData(frame, 0, 0);
    const cw = maxX - minX + 1, ch = maxY - minY + 1;
    const out = document.createElement('canvas');
    out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(cv, minX, minY, cw, ch, 0, 0, cw, ch);
    face.src = out.toDataURL('image/png');
  }

  /* ================= старт ================= */
  buildShop();
  buildGoldShop();
  buildAchUI();
  load();
  paint(stats(), true);
  checkAch(stats());
  setTab('tap');
  setTimeout(moveInd, 300);

  let savedSound = '1';
  try { savedSound = LS.get(SND_KEY); } catch (e) {}
  setSound(savedSound !== '0');

  setInterval(save, 3000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) save();
    else Sound.init();
  });
  window.addEventListener('pagehide', save);

  requestAnimationFrame(loop);
})();
</script>
